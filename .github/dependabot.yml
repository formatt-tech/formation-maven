# Actions et Dev Container seulement : les versions Maven sont citées dans les réponses des modules,
# elles se montent à la main, en relisant les réponses
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: quarterly
    commit-message:
      prefix: build
